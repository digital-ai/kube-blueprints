apiVersion: v1
kind: Secret
metadata:
  name: dai-xld-rabbitmq-secret
type: Opaque
stringData:
  username: guest
  password: guest
  rabbitmq-erlang-cookie: DEPLOYRABBITMQCLUSTER
  # Imported by the broker on every boot (definitions.import_backend in 302) so the
  # guest user/vhost/permissions are reconciled even when a preserved PVC holds a
  # stale operator-generated default user.
  definitions.json: |
    {
      "users": [
        { "name": "guest", "password": "guest", "tags": ["administrator"] }
      ],
      "vhosts": [
        { "name": "/" }
      ],
      "permissions": [
        { "user": "guest", "vhost": "/", "configure": ".*", "write": ".*", "read": ".*" }
      ]
    }